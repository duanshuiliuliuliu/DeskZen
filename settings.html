<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskZen · 设置</title>
  </head>
  <body class="settings-body">
    <main class="settings-root">
      <aside class="settings-sidebar">
        <div class="settings-logo">DeskZen</div>
        <nav class="settings-nav">
          <button class="nav-item active" data-panel="role" type="button">角色</button>
          <button class="nav-item" data-panel="llm" type="button">大模型</button>
          <button class="nav-item" data-panel="log" type="button">日志</button>
          <button class="nav-item" data-panel="about" type="button">关于</button>
        </nav>
      </aside>

      <div class="settings-content">
        <section id="panel-role" class="settings-panel">
          <header class="settings-header">
            <h1>角色设置</h1>
          </header>

          <section class="settings-group">
            <h2>已支持角色</h2>
            <div id="imported-list" class="imported-list"></div>
            <p id="imported-hint" class="settings-hint"></p>
            <p id="imported-status" class="settings-hint"></p>
          </section>

          <section class="settings-group">
            <h2>桌面表现</h2>
            <label class="settings-row settings-check">
              <span class="check-label">
                <span class="check-label-main">点击穿透</span>
                <small class="check-label-sub">鼠标穿过角色窗口，不挡住下层操作</small>
              </span>
              <input type="checkbox" id="passthrough" />
            </label>
            <label class="settings-row settings-row-zoom">
              <span>角色缩放</span>
              <select id="persona-zoom">
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="1.75">175%</option>
                <option value="2">200%</option>
              </select>
            </label>
            <p id="persona-zoom-status" class="settings-hint"></p>
          </section>

          <section class="settings-group">
            <h2>角色导入</h2>
            <p class="settings-hint">选择一个包含 persona.json 与 clips/ 动作帧条的文件夹，或直接选择打包好的 zip 文件。</p>
            <div id="local-import-drop" class="local-import-drop">
              <span class="local-import-drop-icon">📦</span>
              <span>将角色文件夹或 zip 拖到此处导入</span>
            </div>
            <div class="btn-group">
              <button id="local-import" class="btn btn-primary" type="button">从本地文件夹导入</button>
              <button id="local-import-zip" class="btn btn-primary" type="button">从本地 zip 导入</button>
            </div>
            <p id="local-import-status" class="settings-hint"></p>
          </section>
        </section>

        <section id="panel-llm" class="settings-panel">
          <header class="settings-header">
            <h1>大模型设置</h1>
            <span id="settings-status" class="settings-status"></span>
          </header>

          <section class="settings-group">
            <label class="settings-field">
              <span>接口地址</span>
              <input id="base-url" type="text" />
            </label>
            <label class="settings-field">
              <span>模型</span>
              <input id="model" type="text" />
            </label>
            <label class="settings-field">
              <span>API Key</span>
              <input id="api-key" type="password" placeholder="sk-…" autocomplete="off" />
            </label>
            <label class="settings-field">
              <span>温度 (temperature)</span>
              <input id="temperature" type="number" min="0" max="2" step="0.1" />
            </label>
            <label class="settings-field">
              <span>最大输出 Token</span>
              <input id="max-tokens" type="number" min="64" max="4096" step="1" />
            </label>
            <label class="settings-row settings-check">
              <span class="check-label">
                <span class="check-label-main">AI 每日气泡</span>
                <small class="check-label-sub">每天用大模型为各状态生成新台词；未配置大模型时使用角色自带文案</small>
              </span>
              <input type="checkbox" id="ai-bubbles" />
            </label>
            <button id="llm-save" class="btn btn-primary">保存模型配置</button>
            <p class="settings-hint">发送图片时，请使用支持图像输入的视觉模型。</p>
          </section>
        </section>

        <section id="panel-log" class="settings-panel">
          <header class="settings-header">
            <h1>日志</h1>
            <span id="log-status" class="settings-status"></span>
          </header>

          <section class="settings-group">
            <label class="settings-field">
              <span>日志级别</span>
              <select id="log-level"></select>
            </label>
            <label class="settings-field">
              <span>单个文件大小</span>
              <select id="log-size"></select>
            </label>
            <button id="log-open" class="btn" type="button">打开日志目录</button>
          </section>
        </section>

        <section id="panel-about" class="settings-panel">
          <header class="settings-header">
            <h1>关于</h1>
          </header>
          <section class="settings-group">
            <h2>DeskZen</h2>
            <div class="about-list">
              <p><span>版本号</span><span id="app-version">—</span></p>
              <p><span>内置角色</span>林克</p>
              <p><span>作者</span>duanshuiliuliuliu</p>
            </div>
          </section>

        </section>

        <footer class="settings-footer">
          <button id="quit-app" class="btn btn-danger">退出 DeskZen</button>
        </footer>
      </div>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
